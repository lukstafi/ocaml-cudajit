name: github pages

on:
  push:
    branches:
      - main  # Set a branch name to trigger deployment

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Avoid Ubuntu 24.04, see: https://github.com/ocaml/opam/issues/5968
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: Jimver/cuda-toolkit@v0.2.22
        id: cuda-toolkit
        with:
          method: network
          sub-packages: '[ "cudart", "cudart-dev", "nvrtc", "nvrtc-dev" ]'

      - name: Cache opam
        id: cache-opam
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-ubuntu-22.04-5.2.0

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2.0'

      - name: Pin
        run: opam pin -n .

      - name: Depext
        run: opam depext -yt ocannl_npy arrayjit neural_nets_lib

      - name: Deps
        run: opam install -d . --deps-only

      - name: Build
        run: opam exec -- dune build @doc

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/default/_doc/_html'

  deploy:
    # Split from build so artifact finalization settles before deploy-pages
    # lists run artifacts and re-running a failed deploy does not upload a
    # duplicate github-pages artifact.
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
